# ─────────────────────────────────────────────────────────────────────────────
# helpers / internals (not user commands; ported per shell, never registry-asserted
# as user-facing, but tracked so the ports stay aligned)
# ─────────────────────────────────────────────────────────────────────────────
helpers:
  api: [__arr_api, __plex_api, __seerr_api, __nzbdav_api, __stack_curl,
        __stack_containers, __stack_arr_app, __arr_api_key, __arr_api_url,
        __plex_butler, __stack_metadata]
  loader: [__bearcave_load_env, __bearcave_warn_stale_keys, _fmt_color_enabled,
           fmt_heading, fmt_success, fmt_error, fmt_warning, fmt_dim,
           fmt_kv, fmt_status_dot, docker_wrapper, copy, backup]
  host: [__host_containers, __host_helper]

# Registry conformance: every `functions[].name` must exist in bash/, zsh/,
# and fish/ (with its generated stack-* alias where applicable); every public
# function in a port must have a row. Helpers above are exempt from the
# user-facing alias rule but must exist in each port's private layer.
