# spec/functions.yaml — canonical function registry (D2/D17)
#
# Every function is registered ONCE here; each shell port (bash/, zsh/, fish/)
# is a 1:1 translation of its row, and the offline suites assert registry
# conformance (every row exists in all three ports, no unregistered function).
#
# Source: the M1 inventory ledger (WhispersOfJ/thebearcave
# cave-scripts-inventory.md). Names use the cave-* scheme (L2: host
# diagnostics are cave-sys-*); stack-* aliases are generated, never listed.
#
# Fields:
#   name      cave-* command
#   family    media family / sys / de / backup / btrfs / helper
#   safety    read-only | mutating-safe | destructive-confirm | internal
#   timeout   api: light|mutate|heavy | none (media API calls) | host (no API)
#   args      known flags/arguments (exact per-flag parity lands with the M2
#             porting pass + L1 body diffs; entries marked "M2" are filled
#             there)
#   out       output contract — canonical wording is the ported bash
#             implementation; the M2 offline suites assert exact lines.
#             Marked "(tests)" where the contract is pinned by tests, not prose.
#
# Defaults by family (applied unless overridden on the row):
#   media read families  -> safety read-only,   timeout light
#   media mutate actions -> safety mutating-safe, timeout mutate
#   maintenance/db ops   -> timeout heavy
#   host sys / de / btrfs-> safety read-only,   timeout none/host (mutations
#                          explicitly marked on the row)
#
# Regeneration policy: any API/endpoint or behaviour change edits the row
# first, then every port + its tests.

