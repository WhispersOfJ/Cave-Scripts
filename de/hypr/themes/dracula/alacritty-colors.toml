# alacritty terminal colors — dracula (Dracula) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"

[colors.cursor]
cursor = "#bd93f9"
text = "#282a36"

[colors.selection]
background = "#44475a"
text = "#f8f8f2"

# normal.blue/bright.cyan = bd93f9 deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#44475a"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#ffb86c"
blue    = "#bd93f9"
magenta = "#bd93f9"
cyan    = "#8be9fd"
white   = "#6272a4"

[colors.bright]
black   = "#44475a"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#8be9fd"
magenta = "#bd93f9"
cyan    = "#bd93f9"
white   = "#f8f8f2"
