# hyprlock — auto (Matched to catppuccin-mocha.png) · generated by render-theme.sh
general {
    hide_cursor = true
    ignore_empty_input = true
    # grace period is now a CLI flag (see hyprlock invocations); fade is on
    # by default via the animations system.
}

background {
    monitor = HDMI-A-1
    path = /home/bear/.config/hypr/themes/auto/wallpaper.png
    color = rgba(18, 19, 24, 1.0)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor = HDMI-A-1
    size = 360, 60
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(179, 197, 255, 0.9)
    inner_color = rgba(18, 19, 24, 0.9)
    font_color = rgba(227, 226, 233, 1.0)
    fade_on_empty = true
    check_color = rgba(179, 197, 255, 1.0)
    fail_color = rgba(255, 180, 171, 0.9)
    capslock_color = rgba(192, 198, 221, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <span foreground="##c5c6d0">Password…</span>
}

label {
    monitor = HDMI-A-1
    text = $TIME
    font_family = MesloLGS Nerd Font
    font_size = 42
    color = rgba(227, 226, 233, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +'%A, %d %B  %Y')"
    font_family = MesloLGS Nerd Font
    font_size = 16
    color = rgba(197, 198, 208, 1.0)
    position = 0, 55
    halign = center
    valign = center
}
