# alacritty terminal colors — auto (Matched to catppuccin-mocha.png) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#121318"
foreground = "#e3e2e9"

[colors.cursor]
cursor = "#b3c5ff"
text = "#121318"

[colors.selection]
background = "#1e1f25"
text = "#e3e2e9"

# normal.blue/bright.cyan = b3c5ff deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#1e1f25"
red     = "#ffb4ab"
green   = "#b3c5ff"
yellow  = "#e1bbdc"
blue    = "#b3c5ff"
magenta = "#c0c6dd"
cyan    = "#e1bbdc"
white   = "#c5c6d0"

[colors.bright]
black   = "#8f909a"
red     = "#ffb4ab"
green   = "#b3c5ff"
yellow  = "#c0c6dd"
blue    = "#e1bbdc"
magenta = "#c0c6dd"
cyan    = "#b3c5ff"
white   = "#e3e2e9"
