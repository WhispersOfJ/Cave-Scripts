# hyprlock — gruvbox (Gruvbox dark (current)) · generated by render-theme.sh
general {
    hide_cursor = true
    ignore_empty_input = true
    # grace period is now a CLI flag (see hyprlock invocations); fade is on
    # by default via the animations system.
}

background {
    monitor = HDMI-A-1
    path = /home/bear/.config/hypr/themes/gruvbox/wallpaper.png
    color = rgba(40, 40, 40, 1.0)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor = HDMI-A-1
    size = 360, 60
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(69, 133, 136, 0.9)
    inner_color = rgba(40, 40, 40, 0.9)
    font_color = rgba(235, 219, 178, 1.0)
    fade_on_empty = true
    check_color = rgba(142, 192, 124, 1.0)
    fail_color = rgba(251, 73, 52, 0.9)
    capslock_color = rgba(250, 189, 47, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <span foreground="##a89984">Password…</span>
}

label {
    monitor = HDMI-A-1
    text = $TIME
    font_family = MesloLGS Nerd Font
    font_size = 42
    color = rgba(235, 219, 178, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +'%A, %d %B  %Y')"
    font_family = MesloLGS Nerd Font
    font_size = 16
    color = rgba(168, 153, 132, 1.0)
    position = 0, 55
    halign = center
    valign = center
}
