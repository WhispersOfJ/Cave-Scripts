# alacritty terminal colors — gruvbox (Gruvbox dark (current)) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#458588"
text = "#282828"

[colors.selection]
background = "#3c3836"
text = "#ebdbb2"

# normal.blue/bright.cyan = 458588 deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#3c3836"
red     = "#fb4934"
green   = "#8ec07c"
yellow  = "#fe8019"
blue    = "#458588"
magenta = "#d3869b"
cyan    = "#83a598"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#8ec07c"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#458588"
white   = "#ebdbb2"
