# hyprlock — nord (Nord (polar night)) · generated by render-theme.sh
general {
    hide_cursor = true
    ignore_empty_input = true
    # grace period is now a CLI flag (see hyprlock invocations); fade is on
    # by default via the animations system.
}

background {
    monitor = HDMI-A-1
    path = /home/bear/.config/hypr/themes/nord/wallpaper.png
    color = rgba(46, 52, 64, 1.0)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor = HDMI-A-1
    size = 360, 60
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(136, 192, 208, 0.9)
    inner_color = rgba(46, 52, 64, 0.9)
    font_color = rgba(236, 239, 244, 1.0)
    fade_on_empty = true
    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 0.9)
    capslock_color = rgba(235, 203, 139, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <span foreground="##d8dee9">Password…</span>
}

label {
    monitor = HDMI-A-1
    text = $TIME
    font_family = MesloLGS Nerd Font
    font_size = 42
    color = rgba(236, 239, 244, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +'%A, %d %B  %Y')"
    font_family = MesloLGS Nerd Font
    font_size = 16
    color = rgba(216, 222, 233, 1.0)
    position = 0, 55
    halign = center
    valign = center
}
