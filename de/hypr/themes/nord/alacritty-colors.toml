# alacritty terminal colors — nord (Nord (polar night)) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#2e3440"
foreground = "#eceff4"

[colors.cursor]
cursor = "#88c0d0"
text = "#2e3440"

[colors.selection]
background = "#3b4252"
text = "#eceff4"

# normal.blue/bright.cyan = 88c0d0 deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#3b4252"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#d08770"
blue    = "#88c0d0"
magenta = "#b48ead"
cyan    = "#81a1c1"
white   = "#d8dee9"

[colors.bright]
black   = "#616e88"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#eceff4"
