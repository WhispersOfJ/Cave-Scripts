# alacritty terminal colors — rose-pine (Rosé Pine) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#191724"
foreground = "#e0def4"

[colors.cursor]
cursor = "#ebbcba"
text = "#191724"

[colors.selection]
background = "#1f1d2e"
text = "#e0def4"

# normal.blue/bright.cyan = ebbcba deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#1f1d2e"
red     = "#eb6f92"
green   = "#9ccfd8"
yellow  = "#f6c177"
blue    = "#ebbcba"
magenta = "#c4a7e7"
cyan    = "#9ccfd8"
white   = "#908caa"

[colors.bright]
black   = "#6e6a86"
red     = "#eb6f92"
green   = "#9ccfd8"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"
