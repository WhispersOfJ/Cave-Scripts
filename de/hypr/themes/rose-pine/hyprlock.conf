# hyprlock — rose-pine (Rosé Pine) · generated by render-theme.sh
general {
    hide_cursor = true
    ignore_empty_input = true
    # grace period is now a CLI flag (see hyprlock invocations); fade is on
    # by default via the animations system.
}

background {
    monitor = HDMI-A-1
    path = /home/bear/.config/hypr/themes/rose-pine/wallpaper.png
    color = rgba(25, 23, 36, 1.0)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor = HDMI-A-1
    size = 360, 60
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(235, 188, 186, 0.9)
    inner_color = rgba(25, 23, 36, 0.9)
    font_color = rgba(224, 222, 244, 1.0)
    fade_on_empty = true
    check_color = rgba(156, 207, 216, 1.0)
    fail_color = rgba(235, 111, 146, 0.9)
    capslock_color = rgba(246, 193, 119, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <span foreground="##908caa">Password…</span>
}

label {
    monitor = HDMI-A-1
    text = $TIME
    font_family = MesloLGS Nerd Font
    font_size = 42
    color = rgba(224, 222, 244, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +'%A, %d %B  %Y')"
    font_family = MesloLGS Nerd Font
    font_size = 16
    color = rgba(144, 140, 170, 1.0)
    position = 0, 55
    halign = center
    valign = center
}
