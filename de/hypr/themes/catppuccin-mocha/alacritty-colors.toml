# alacritty terminal colors — catppuccin-mocha (Catppuccin Mocha) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
cursor = "#cba6f7"
text = "#1e1e2e"

[colors.selection]
background = "#313244"
text = "#cdd6f4"

# normal.blue/bright.cyan = cba6f7 deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#313244"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#fab387"
blue    = "#cba6f7"
magenta = "#cba6f7"
cyan    = "#89b4fa"
white   = "#a6adc8"

[colors.bright]
black   = "#6c7086"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#cba6f7"
white   = "#cdd6f4"
