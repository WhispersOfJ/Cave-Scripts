# alacritty terminal colors — tokyonight (Tokyo Night) · generated by render-theme.sh
# Copied to ~/.config/alacritty/colors.toml by hyprtheme; imported from the
# static ~/.config/alacritty/alacritty.toml (font/window settings live there).

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
cursor = "#7aa2f7"
text = "#1a1b26"

[colors.selection]
background = "#24283b"
text = "#c0caf5"

# normal.blue/bright.cyan = 7aa2f7 deliberately, so stack-tui's header/
# button chrome ("dark blue" bg) and category labels ("light cyan" fg) pick
# up the theme's signature color, same as borders/highlights everywhere else.
[colors.normal]
black   = "#24283b"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#ff9e64"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7aa2f7"
white   = "#9aa5ce"

[colors.bright]
black   = "#565f89"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7aa2f7"
white   = "#c0caf5"
