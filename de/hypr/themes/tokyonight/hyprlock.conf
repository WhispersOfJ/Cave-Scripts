# hyprlock — tokyonight (Tokyo Night) · generated by render-theme.sh
general {
    hide_cursor = true
    ignore_empty_input = true
    # grace period is now a CLI flag (see hyprlock invocations); fade is on
    # by default via the animations system.
}

background {
    monitor = HDMI-A-1
    path = /home/bear/.config/hypr/themes/tokyonight/wallpaper.png
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor = HDMI-A-1
    size = 360, 60
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.9)
    inner_color = rgba(26, 27, 38, 0.9)
    font_color = rgba(192, 202, 245, 1.0)
    fade_on_empty = true
    check_color = rgba(158, 206, 106, 1.0)
    fail_color = rgba(247, 118, 142, 0.9)
    capslock_color = rgba(224, 175, 104, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <span foreground="##9aa5ce">Password…</span>
}

label {
    monitor = HDMI-A-1
    text = $TIME
    font_family = MesloLGS Nerd Font
    font_size = 42
    color = rgba(192, 202, 245, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date +'%A, %d %B  %Y')"
    font_family = MesloLGS Nerd Font
    font_size = 16
    color = rgba(154, 165, 206, 1.0)
    position = 0, 55
    halign = center
    valign = center
}
