# ═══════════════════════════════════════════════════════════════════
#  Hyprland — Gruvbox dark base config
#  bear / CachyOS · AMD Radeon 680M · 55" 4K TV (HDMI-A-1, scale 1.7)
#
#  Theme switching:  hyprtheme              (opens wofi picker)
#                    hyprtheme <name>       (apply directly)
#  Available: gruvbox · catppuccin-mocha · tokyonight · nord ·
#             rose-pine · dracula
#
#  Sway has been removed (2026-09-05) — Hyprland is now the only session.
#  ~/.config/sway/ still exists (inert: config + backups), not autoloaded.
# ═══════════════════════════════════════════════════════════════════

### Monitor ─────────────────────────────────────────────────────────
monitor = HDMI-A-1, preferred, auto, 1.7

### Environment ─────────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,Bibata-Modern-Classic-Gruvbox
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = HYPRCURSOR_THEME,Bibata-Modern-Classic-Gruvbox
env = HYPRCURSOR_SIZE,24

### Input ───────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

### Cursor ──────────────────────────────────────────────────────────
cursor {
    no_hardware_cursors = false
}

### General (layout · gaps · borders) ───────────────────────────────
general {
    gaps_in = 12
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(458588cc) rgba(fabd2f99) 45deg
    col.inactive_border = rgba(3c3836aa)
    layout = dwindle
    resize_on_border = true
}

### Decoration — full polish ────────────────────────────────────────
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.97
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 5
        passes = 2
        ignore_opacity = true
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

### hyprbars (plugin) ─────────────────────────────────────────────
plugin {
    hyprbars {
        bar_height = 24
        bar_color = rgb(3c3836)
        col.text = rgb(ebdbb2)
        bar_text_size = 10
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_align = left
        bar_padding = 10
        bar_button_padding = 6
        bar_part_of_window = true
        bar_precedence_over_border = true
        icon_on_hover = false
        hyprbars-button = rgb(fb4934), 18, 󰖭, hyprctl dispatch killactive
        on_double_click = hyprctl dispatch fullscreen 1
    }
}

### Animations — snappy ─────────────────────────────────────────────
animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.0
    bezier = winIn, 0.05, 0.9, 0.1, 1.0
    bezier = winOut, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 4, wind, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default, slidefade 25%
    animation = border, 1, 6, default
    animation = borderangle, 1, 100, default, loop
}

### Dwindle layout ──────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

### Window rules ────────────────────────────────────────────────────
# stack-tui overlays float (mirror of sway include stack-tui.conf)
windowrule = float 1, match:class ^(stack_tui)$
# launchers/pickers can float when they want to
windowrule = float 1, match:title ^(wlogout)$
# waybar.css uses a semi-transparent background; blur it against the desktop
# (see scripts/build-themes.sh for the per-theme bar styling).
layerrule = blur 1, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.2, match:namespace ^(waybar)$

# hyprbars (plugin, see 7e in HYPR.md) — bar_color/col.text are also updated
# live per-theme by hyprtheme's apply(), same pattern as the border colors.
windowrule {
    name = stack-tui-no-bar
    match:class = ^(stack_tui)$
    hyprbars:no_bar = true
}
windowrule {
    name = wlogout-no-bar
    match:title = ^(wlogout)$
    hyprbars:no_bar = true
}

### Workspaces ──────────────────────────────────────────────────────
workspace = special:scratchpad, gapsout:12, gapsin:12, border:false

### Autostart ───────────────────────────────────────────────────────
exec-once = hyprpaper
exec-once = hypridle
exec-once = swaync
exec-once = waybar
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = swayosd-server
exec-once = gammastep
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image/png --watch cliphist store

### Keybindings ─────────────────────────────────────────────────────
$mainMod = SUPER
$menu = wofi --show drun

# ── Basics ─────────────────────────────────────────────────
bind = $mainMod, Return, exec, foot
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, E, exec, wlogout -p layer-shell
bind = $mainMod, Escape, exec, hyprlock --grace 5

# ── Focus (hjkl + arrows) ───────────────────────────────────
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# ── Move windows ────────────────────────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# ── Workspaces ──────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Layout ──────────────────────────────────────────────────
# sway: $mod+b splith · $mod+v splitv · $mod+e toggle split
bind = $mainMod, B, layoutmsg, togglesplit
bind = $mainMod, V, layoutmsg, togglesplit
bind = $mainMod, E, layoutmsg, togglesplit
# sway stacking/tabbed → Hyprland tab groups
bind = $mainMod, S, layoutmsg, togglegroup
bind = $mainMod, W, layoutmsg, togglegroup
bind = $mainMod SHIFT, G, layoutmsg, togglegroup
bind = $mainMod, F, fullscreen
# sway: $mod+Shift+space floating · $mod+space focus mode_toggle
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, SPACE, cyclenext, tiled

# ── Scratchpad (special workspace) ──────────────────────────
bind = $mainMod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mainMod, minus, togglespecialworkspace, scratchpad

# ── Resize mode (same as sway) ──────────────────────────────
submap = resize
bind = , left, resizeactive, -15 0
bind = , down, resizeactive, 0 15
bind = , up, resizeactive, 0 -15
bind = , right, resizeactive, 15 0
bind = , h, resizeactive, -15 0
bind = , j, resizeactive, 0 15
bind = , k, resizeactive, 0 -15
bind = , l, resizeactive, 15 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
bind = $mainMod, R, submap, resize

# ── Media keys (swayosd OSD) ────────────────────────────────
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bind = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bind = , XF86AudioPrev, exec, swayosd-client --playerctl prev
bind = , XF86AudioNext, exec, swayosd-client --playerctl next
bind = , XF86AudioStop, exec, swayosd-client --playerctl stop
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise

# ── Screenshots (grim unchanged from sway) ──────────────────
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -
# Hyprland-native extras
bind = $mainMod SHIFT, S, exec, hyprshot -m region
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# ── Records, clipboard, night light, idle ────────────────────
bind = $mainMod SHIFT, R, exec, $HOME/.config/hypr/scripts/recorder-toggle.sh
bind = $mainMod SHIFT, V, exec, $HOME/.config/hypr/scripts/cliphist-pick.sh
bind = $mainMod SHIFT, N, exec, $HOME/.config/hypr/scripts/gammastep-toggle.sh
bind = $mainMod SHIFT, I, exec, $HOME/.config/hypr/scripts/idle-toggle.sh
bind = $mainMod SHIFT, T, exec, $HOME/.config/hypr/scripts/hyprtheme

### Mouse ───────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow