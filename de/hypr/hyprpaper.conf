# hyprpaper — wallpaper daemon
# hyprtheme rewrites the `path` line below when switching themes.
# NOTE: hyprpaper 0.8+ dropped the old `preload` / `wallpaper = MONITOR,path`
# directives in favor of a `wallpaper { }` block, and it re-reads this file
# only at startup (no live reload) — hyprtheme restarts the daemon instead.

splash = false
ipc = true

wallpaper {
    monitor = HDMI-A-1
    path = /home/bear/.config/hypr/themes/gruvbox/wallpaper.png
    fit_mode = cover
}