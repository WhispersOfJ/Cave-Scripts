# hypridle — port of swayidle.sh (lock at 5 min, DPMS off at 10 min,
# lock before sleep). Toggled by scripts/idle-toggle.sh (presentation mode).

general {
    # grace period moved from hyprlock.conf's `general:grace` (removed in hyprlock
    # 0.9.x) to a --grace CLI flag; kept here so idle-lock behaves as before.
    lock_cmd = hyprlock --grace 5
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}